version: '3.8'

services:
  backend:
    build:
      context: ./apps/backend
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    networks:
      - kita-network

  frontend:
    build:
      context: ./apps/frontend
      dockerfile: Dockerfile
    ports:
      - "3000:80" # Mapping port lokal 3000 ke port 80 Nginx di container
    networks:
      - kita-network

networks:
  kita-network:
